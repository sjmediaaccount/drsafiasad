<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Login — Dr. Safi Asad Clinic</title>
  <link rel="stylesheet" href="style.css">
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🌿</text></svg>">
</head>
<body>

  <div class="admin-login-page">
    <div class="admin-login-card">
      <div class="modal-header">
        <div class="admin-login-logo">
          <div class="logo-icon">
            <svg viewBox="0 0 24 24"><path d="M12 2C7 4 4 8 4 14c0 4 3.5 7 8 8 4.5-1 8-4 8-8 0-6-3-10-8-12z" fill="white" stroke="none"/><path d="M12 8v8M8 12h8" stroke="white" fill="none" stroke-width="2" stroke-linecap="round"/></svg>
          </div>
          <div class="logo-text">
            <span class="navy">Dr. Safi Asad</span>
            <span class="teal">Homeopathic Care</span>
          </div>
        </div>
        <div class="admin-badge">🔒 Admin Panel</div>
        <h2 style="margin-top: 18px;">Admin Sign In</h2>
        <p>Enter your admin credentials to continue</p>
      </div>

      <!-- Credentials Hint Box -->
      <div style="background: rgba(20, 184, 166, 0.08); border: 1px solid rgba(20, 184, 166, 0.25); border-radius: var(--radius-sm); padding: 14px; margin-bottom: 20px; text-align: left; font-size: 0.88rem;">
        <div style="font-weight: 700; color: var(--navy); margin-bottom: 4px;">🔑 Admin Login Credentials:</div>
        <div style="display: flex; justify-content: space-between; margin-bottom: 2px;">
          <span>Email: <strong style="color: var(--teal);">shazeemjaved88@gmail.com</strong></span>
        </div>
        <div style="display: flex; justify-content: space-between;">
          <span>Password: <strong style="color: var(--teal);">Pakistan@321</strong></span>
        </div>
      </div>

      <!-- 1-Click Instant Login Button -->
      <a href="/api/auth/one-click-admin" class="btn btn-teal" style="width: 100%; display: flex; align-items: center; justify-content: center; gap: 8px; margin-bottom: 20px; font-weight: 700; text-decoration: none; padding: 12px; font-size: 0.95rem;">
        <span>⚡ 1-Click Instant Admin Login</span>
      </a>

      <div style="display: flex; align-items: center; gap: 12px; margin-bottom: 20px;">
        <div style="flex: 1; height: 1px; background: #E2E8F0;"></div>
        <span style="font-size: 0.78rem; font-weight: 600; color: var(--text-light); text-transform: uppercase;">Or Login Manually</span>
        <div style="flex: 1; height: 1px; background: #E2E8F0;"></div>
      </div>

      <div class="alert alert-error" id="adminError"></div>

      <form id="adminLoginForm" onsubmit="handleAdminLogin(event)">
        <div class="form-group">
          <label class="form-label" for="adminEmail">Email Address</label>
          <div class="form-input-icon">
            <svg viewBox="0 0 24 24"><path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"/><polyline points="22,6 12,13 2,6"/></svg>
            <input type="email" id="adminEmail" class="form-input" value="shazeemjaved88@gmail.com" placeholder="shazeemjaved88@gmail.com" required>
          </div>
        </div>
        <div class="form-group">
          <label class="form-label" for="adminPassword">Password</label>
          <div class="form-input-icon">
            <svg viewBox="0 0 24 24"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
            <input type="password" id="adminPassword" class="form-input" value="Pakistan@321" placeholder="••••••••" required>
          </div>
        </div>
        <button type="submit" class="btn btn-navy form-submit" id="adminLoginBtn" style="width:100%; font-weight:700;">Sign In to Dashboard</button>
      </form>

      <div class="form-footer" style="margin-top: 24px; display: flex; flex-direction: column; gap: 8px; align-items: center;">
        <a href="admin-setup.html" style="color: var(--teal); font-weight: 600; font-size: 0.88rem; text-decoration: none;">⚙️ Reset / Change Admin Password</a>
        <a href="index.html" class="form-link" style="font-size: 0.85rem;">&larr; Back to Website</a>
      </div>
    </div>
  </div>

  <script>
    // Check if already logged in as admin
    (async function() {
      try {
        const res = await fetch('/api/auth/me');
        if (res.ok) {
          const data = await res.json();
          if (data.user.role === 'admin') {
            window.location.href = 'admin-dashboard.html';
          }
        }
      } catch {}
    })();

    async function handleAdminLogin(e) {
      e.preventDefault();
      const errorEl = document.getElementById('adminError');
      errorEl.classList.remove('visible');
      errorEl.textContent = '';

      const btn = document.getElementById('adminLoginBtn');
      btn.disabled = true;
      btn.innerHTML = '<span class="spinner"></span> Signing in...';

      try {
        const res = await fetch('/api/auth/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            email: document.getElementById('adminEmail').value,
            password: document.getElementById('adminPassword').value
          })
        });
        const data = await res.json();
        if (!res.ok) throw new Error(data.error);

        if (data.user.role !== 'admin') {
          throw new Error('This account does not have admin access.');
        }

        window.location.href = 'admin-dashboard.html';
      } catch (err) {
        errorEl.textContent = err.message;
        errorEl.classList.add('visible');
      } finally {
        btn.disabled = false;
        btn.textContent = 'Sign In';
      }
    }
  </script>

</body>
</html>
